version: '3.8'
services:
  app:
    container_name: app
    restart: always
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPOSITORY}:app
    ports:
      - "8000:8000"
  nginx:
    container_name: proxy
    restart: always
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPOSITORY}:nginx
    ports:
      - "80:80"
    volumes:
      - /var/log/nginx/:/var/log/nginx/
    depends_on:
      - app
