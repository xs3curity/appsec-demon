stages:
  - sast
  - build
  - unittest
  - deploy
  - dast-cstm

SAST:
  stage: sast
  script:
    - docker pull python:latest
    - docker run --volume ./:/app python bash -c 'pip3 install bandit && bandit -r /app'
  tags:
    - CI-CD
  only:
    - prod
  allow_failure: true

Build:
  stage: build
  script:
    - docker-compose build
  tags:
    - CI-CD
  only:
  - prod

Unittest:
  stage: unittest
  script:
    - docker run appsec_demon_app python tests.py
  tags:
    - CI-CD
  needs:
    - Build
  only:
  - prod

Deploy:
  stage: deploy
  script:
    - docker-compose down
    - docker-compose build
    - docker-compose up -d
  tags:
    - prod-deploy
  only:
  - prod

DAST:
  stage: dast-cstm
  script:
    - docker pull owasp/zap2docker-stable
    - rm -rf ./reports
    - mkdir ./reports
    - docker run --volume ./reports:/zap/wrk --user root --net=host --rm owasp/zap2docker-stable zap-full-scan.py -t http://192.168.56.100:80 -r report.html
  tags:
    - CI-CD
  only:
  - prod
  needs:
    - Deploy
  artifacts:
    paths:
      - "reports/report.html"
    when: always
  allow_failure: true