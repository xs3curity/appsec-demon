SAST:
  stage: test
  script:
    - echo "Do your build here"
  tags:
    - CI-CD

Build:
  stage: build
  script:
    - docker-compose build
  tags:
    - CI-CD
  needs:
    - SAST

Unittest:
  stage: test
  script:
    - docker run appsec_demon_app python tests.py
  tags:
    - CI-CD
  needs:
    - Build

Deploy:
  stage: deploy
  script:
    - echo "Do your deploy here"
  tags:
    - CI-CD
  needs:
    - Build
    - Unittest

DAST:
  stage: test
  script:
    - echo "Do another parallel test here"
  tags:
    - CI-CD
  needs:
    - Deploy