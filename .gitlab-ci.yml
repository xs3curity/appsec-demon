stages:
  - build
  - test
  - deploy

SAST:
  stage: build
  script:
    - docker pull python:latest
    - docker run --volume ./:/app python bash -c 'pip3 install bandit && bandit -r /app'
  tags:
    - CI-CD
  allow_failure: true

Build:
  stage: build
  script:
    - docker-compose build
  tags:
    - CI-CD
  needs:
    - SAST

Unittest:
  stage: test
  script:
    - docker run appsec_demon_app python tests.py
  tags:
    - CI-CD
  needs:
    - Build

Deploy:
  stage: deploy
  script:
    - docker-compose down
    - docker-compose build
    - docker-compose up -d
  tags:
    - prod-deploy

DAST:
  stage: deploy
  script:
    - docker pull owasp/zap2docker-stable
    - rm -f ./report.html
    - docker run --volume $(pwd):/zap/wrk:rw  --net=host --rm owasp/zap2docker-stable zap-full-scan.py -t http://192.168.100.20:80 -r report.html
  tags:
    - CI-CD
  needs:
    - Deploy
  artifacts:
    paths:
      - "report.html"