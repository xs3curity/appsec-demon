stages:
  - sast
  - build
  - unittest
  - deploy
  - dast-cstm

SAST:
  stage: sast
  script:
    - docker pull python:latest
    - docker run --volume ./:/app python bash -c 'pip3 install bandit && bandit -r /app'
  tags:
    - CI-CD
  only:
    - prod
  allow_failure: true

Build:
  stage: build
  script:
    - echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
    - echo -e "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME\nDOCKER_HUB_REPOSITORY=$DOCKER_HUB_REPOSITORY" > .env
    - cd myprj && docker build -t appsec_demon_app . && cd ..
    - cd myprj && docker build -t appsec_demon_nginx . && cd ..
    - docker tag appsec_demon_app:latest $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:app
    - docker tag appsec_demon_nginx:latest $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:nginx
    - docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:app
    - docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:nginx
  tags:
    - CI-CD
  only:
  - prod

Unittest:
  stage: unittest
  script:
    - docker run appsec_demon_app python tests.py
  tags:
    - CI-CD
  needs:
    - Build
  only:
  - prod

Deploy:
  stage: deploy
  script:
    - echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
    - docker-compose down
    - docker-compose build
    - docker-compose up -d
  tags:
    - prod-deploy
  only:
  - prod

DAST:
  stage: dast-cstm
  script:
    - docker pull owasp/zap2docker-stable
    - rm -rf ./reports
    - mkdir ./reports
    - docker run --volume ./reports:/zap/wrk --user root --net=host --rm owasp/zap2docker-stable zap-full-scan.py -t http://appsec.demon.lab -r report.html
  tags:
    - CI-CD
  only:
  - prod
  needs:
    - Deploy
  artifacts:
    paths:
      - "reports/report.html"
    when: always
  allow_failure: true