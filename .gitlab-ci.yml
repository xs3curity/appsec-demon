stages:
  - build
  - test
  - deploy

SAST:
  stage: build
  script:
    - echo "Running SAST"
  tags:
    - CI-CD

Build:
  stage: build
  script:
    - docker-compose build
  tags:
    - CI-CD
  needs:
    - SAST

Unittest:
  stage: test
  script:
    - docker run appsec_demon_app python tests.py
  tags:
    - CI-CD
  needs:
    - Build

Deploy:
  stage: deploy
  script:
    - echo "Do your deploy here"
  tags:
    - CI-CD

DAST:
  stage: deploy
  script:
    - echo "Running DAST"
  tags:
    - CI-CD
  needs:
    - Deploy
